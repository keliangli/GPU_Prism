name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只允许一个发布流程同时进行，新的推送会取消进行中的旧任务。
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run model tests
        run: node --test

      - name: Setup Python for source extractors
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run source extractor tests
        run: python -m unittest discover -s test/code-atlas -p 'test_*.py'

      # configure-pages 提供项目页的子路径（例如 /GPU_Prism），
      # 传给 build 的 --base，保证 /assets/* 与 /favicon.svg 能正确解析。
      # 这里不改动仓库默认 base（'/'），以免影响其他根路径部署。
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
